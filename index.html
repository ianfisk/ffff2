        .staticrypt-password-container input[type="password"],

            background-color: #f5f5f5;
            color: #a0a0a0;
            cursor: not-allowed;
            border: 2px solid red;
            background: repeating-linear-gradient(45deg,

                    #ff000030 10px,
                    #ff000030 20px);

        .staticrypt-password-container {

            outline: 0;
            background: #f2f2f2;
            width: 100%;
            border: 0;
            margin: 0 0 15px;
            box-sizing: border-box;

            position: absolute;
            right: 0;
            top: 50%;

            width: 100%;
            border: 0;
            padding: 15px;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
